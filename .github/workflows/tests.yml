name: UI Tests and Allure Report

on:
  push:
    branches: [ main ]  # Запуск при каждом пуше в ветку main
  pull_request:
    branches: [ main ]

permissions:
  contents: write  # Разрешение на запись отчетов в ветку gh-pages

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Укажите вашу версию Python

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest selenium webdriver-manager allure-pytest

    # Если ваши тесты запускаются локально в обычном окне, на сервере GitHub их нужно запускать в невидимом (headless) режиме!
    - name: Run tests with Allure
      run: |
        pytest --alluredir=allure-results
      continue-on-error: true # Позволяет продолжить сборку отчета, даже если тесты упали

    - name: Get Allure history
      uses: actions/checkout@v4
      if: always()
      with:
        ref: gh-pages
        path: gh-pages-dir

    - name: Allure Report action
      uses: simple-elf/allure-report-action@master
      if: always()
      id: allure-report
      with:
        allure_results: allure-results
        allure_history: allure-history
        keep_reports: 20

    - name: Deploy report to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      if: always()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: allure-history